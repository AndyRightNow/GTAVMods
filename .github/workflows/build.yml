name: Build Enhanced mod
on:
  push:
    branches:
      - master
      - codex/gta-v-enhanced
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - name: Prepare pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Preserve coverage and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVMods-validation
          path: artifacts/coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: GTAVMods-Enhanced
          path: artifacts/GTAVMods-Enhanced.zip
