[project]
name = "gtavmods-gta-use"
version = "0.1.0"
description = "Local HTTP/WebSocket control and supervised Python agents for GTA V Enhanced Story Mode"
requires-python = ">=3.14,<3.15"
dependencies = [
    "websockets>=15,<18",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/gta_use"]

[project.scripts]
gta-use = "gta_use.__main__:main"
